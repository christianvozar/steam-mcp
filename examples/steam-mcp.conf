# steam-mcp configuration (KEY=VALUE). Environment variables and --set
# override values here. This file is watched: TTLs, disabled tools, write
# enablement, page size, default cc/language and log level reload live.

# --- Steam credentials --------------------------------------------------------
# STEAM_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# STEAM_PUBLISHER_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# STEAM_FINANCIAL_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

STEAM_MCP_DEFAULT_CC=us
STEAM_MCP_DEFAULT_LANGUAGE=english

# --- Cache --------------------------------------------------------------------
STEAM_MCP_CACHE_FILE=/var/lib/steam-mcp/cache.jsonl
STEAM_MCP_CACHE_MAX_BYTES=536870912
STEAM_MCP_CACHE_PERSIST_INTERVAL=60
STEAM_MCP_MAX_STALE_ON_ERROR=86400
# Override TTL classes: ttl[,stale] seconds.
# STEAM_MCP_TTL_REALTIME=30,120
# STEAM_MCP_TTL_STATIC=172800

# --- Upstream protection ------------------------------------------------------
STEAM_MCP_UPSTREAM_RPS=10
STEAM_MCP_UPSTREAM_BURST=20
STEAM_MCP_DAILY_BUDGET=100000

# --- Behaviour ----------------------------------------------------------------
STEAM_MCP_ENABLE_WRITES=false
# STEAM_MCP_DISABLED_TOOLS=steam_partner_authenticate_ticket,steam_api_call
STEAM_MCP_TASK_SYNC_WINDOW_MS=1500
STEAM_MCP_LOG=info
# STEAM_MCP_LOG_FORMAT=json

# --- Many agents (ADR 0018) -------------------------------------------------
STEAM_MCP_PRINCIPAL_MAX_CONCURRENT=8
STEAM_MCP_PRINCIPAL_QUEUE_MS=5000
# STEAM_MCP_PRINCIPAL_DAILY_TOOL_CALLS=20000
# STEAM_MCP_PRINCIPAL_DAILY_UPSTREAM=5000
# Per principal: rps:burst:concurrent:daily_calls:daily_upstream (empty = default)
# STEAM_MCP_PRINCIPAL_LIMITS=ci-*=5:10:4:5000:500;dashboard=::16
# Writes pre-approved for unattended agents: principal|tool|target[|max_per_day]
# STEAM_MCP_WRITE_POLICY=release-bot|steam_partner_set_app_build_live|480|5
# STEAM_MCP_IDEMPOTENCY_TTL=86400
# STEAM_MCP_BATCH_MAX_CALLS=25
# STEAM_MCP_BATCH_PARALLELISM=8

# --- Streamable HTTP ----------------------------------------------------------
# STEAM_MCP_HTTP_BIND=0.0.0.0:8080
# STEAM_MCP_PUBLIC_URL=https://mcp.example.com/mcp
# STEAM_MCP_ALLOWED_ORIGINS=https://app.example.com
# STEAM_MCP_TLS_CERT=/etc/steam-mcp/tls/fullchain.pem
# STEAM_MCP_TLS_KEY=/etc/steam-mcp/tls/privkey.pem
# Share across replicas so MRTR requestState verifies on any instance:
# STEAM_MCP_STATE_SECRET=change-me-to-a-long-random-string

# --- Authorization (OAuth 2.1 resource server) ---------------------------------
# STEAM_MCP_AUTH_MODE=jwt
# STEAM_MCP_AUTHORIZATION_SERVERS=https://auth.example.com
# STEAM_MCP_AUTH_ISSUER=https://auth.example.com
# STEAM_MCP_JWKS_URL=https://auth.example.com/.well-known/jwks.json
#
# STEAM_MCP_AUTH_MODE=static
# STEAM_MCP_AUTH_TOKENS=long-random-token-1=ops:steam:admin;long-random-token-2=analyst:steam:financial
