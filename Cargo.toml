[package]
name = "steam-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Production Model Context Protocol (2026-07-28) server for the Steam Web API and Steamworks partner API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/christianvozar/steam-mcp"
keywords = ["mcp", "steam", "steamworks", "model-context-protocol"]
categories = ["command-line-utilities", "web-programming::http-server"]

# Dependencies are intentionally minimal. Everything (JSON, HTTP/1.1 client and
# server, SSE, caching, SHA-256/HMAC, base64, URI templates, JSON Schema
# validation, threading) is implemented in-tree. TLS and asymmetric signature
# verification are delegated to audited crates because hand-rolled versions
# would be unsafe in production.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
